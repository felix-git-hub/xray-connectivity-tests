name: git1 connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/6h.yml
      - .github/workflows/wrt_probe.py
permissions:
  contents: read
jobs:
  probe:
    name: git1 (6h)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify reverse round trip from wrt1k
        env:
          PROFILE_PARAMS: ${{ secrets.WRT1K_6H_PARAMS }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 --max-time 60 https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o xray.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  xray.zip' | sha256sum -c -
          unzip -qo xray.zip xray
          cd "$GITHUB_WORKSPACE"
          python3 .github/workflows/wrt_probe.py "$RUNNER_TEMP/xray" 6h

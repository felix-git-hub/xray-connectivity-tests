name: git-ali connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/c2.yml
      - .github/workflows/loopback_test.py
permissions:
  contents: read
jobs:
  probe:
    name: git-ali (c2)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exercise reverse Xray over SOCKS in an isolated namespace
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 --max-time 60 https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o xray.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  xray.zip' | sha256sum -c -
          unzip -qo xray.zip xray
          cd "$GITHUB_WORKSPACE"
          sudo unshare --net sh -ec 'ip link set lo up; exec python3 .github/workflows/loopback_test.py "$1" "$2"' sh "$RUNNER_TEMP/xray" c2
      - name: Probe configured public ingress
        env:
          HOST: alicdn.datascientist.top
          PORT: "443"
          TRANSPORT: tls
        run: |
          python3 -u - <<'PY'
          import os, signal, socket, ssl
          signal.alarm(35)
          host, port = os.environ['HOST'], int(os.environ['PORT'])
          print('DNS:', sorted({r[4][0] for r in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}))
          with socket.create_connection((host, port), timeout=10) as sock:
              print('TCP connected:', sock.getpeername()[0])
              if os.environ['TRANSPORT'] == 'tls':
                  with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as tls:
                      print('Certificate verified:', tls.version())
          PY

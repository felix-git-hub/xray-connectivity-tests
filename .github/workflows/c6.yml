name: git-cf connectivity
on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/c6.yml
      - .github/workflows/wrt_probe.py
permissions:
  contents: read
jobs:
  probe:
    name: git-cf (c6)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify reverse round trip from wrt1k
        env:
          PROFILE_PARAMS: ${{ secrets.WRT1K_C6_PARAMS }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 --max-time 60 https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o xray.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  xray.zip' | sha256sum -c -
          unzip -qo xray.zip xray
          cd "$GITHUB_WORKSPACE"
          python3 .github/workflows/wrt_probe.py "$RUNNER_TEMP/xray" c6
